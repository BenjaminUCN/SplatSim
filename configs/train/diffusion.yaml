# Training config for scripts/xarm5/train_diffusion.py.
# Copy this file for each experiment, or override any field from the CLI:
#   python scripts/xarm5/train_diffusion.py --config configs/train/diffusion.yaml --horizon 32 --cameras base_rgb

# ── Run ──────────────────────────────────────────────────────────────────────
model_name: null          # null -> diffusion_<MMDD_HHMM> (output folder)
name: ""                  # short name shown in configs/registry.yaml and the panel, e.g. 1cam-50k
description: ""           # what this model tries to improve, e.g. "1 cam, more steps"
output_root: ~/lerobot/examples/tutorial/diffusion/outputs/robot_learning_tutorial
device: cuda

# ── Dataset ──────────────────────────────────────────────────────────────────
dataset_id: LuEduSoHu/splatsim_xarm5_lite_10fps_261020_2010
dataset_root: ~/lerobot/splatsim_test_data/splatsim_xarm5_lite_10fps_261020_2010
cameras: null             # subset of the dataset cameras, e.g. [base_rgb, wrist_rgb]; null -> all
arrangement: null         # or a camera arrangement from configs/camera_poses.yaml, e.g. 2cam

# ── Policy (DiffusionConfig) ─────────────────────────────────────────────────
n_obs_steps: 2            # observation horizon
horizon: 64               # predicted action horizon; multiple of 8 with the default U-Net
n_action_steps: 32        # actions executed per prediction; <= horizon - n_obs_steps + 1
# Image encoder. Default: ImageNet ResNet18 with BatchNorm (LeRobot default since May 2026).
# Diffusion Policy trains it from scratch with GroupNorm: pretrained_backbone: null, group_norm: true
pretrained_backbone: ResNet18_Weights.IMAGENET1K_V1
group_norm: false

# ── Optimization ─────────────────────────────────────────────────────────────
training_steps: 50000
batch_size: 32
seed: null                # null -> a different run every time
lr_scheduler: false       # true -> cosine with warmup (Diffusion Policy); false -> constant 1e-4
lr_warmup_steps: 500
ema: false                # true -> save and evaluate the EMA of the weights (Diffusion Policy)
ema_power: 0.75
ema_max_decay: 0.9999
num_workers: 12           # each worker keeps prefetch_factor batches in shared memory;
prefetch_factor: 1        # the script prints the estimate and stops if it is over 40% of the RAM
image_augmentation: true  # brightness, contrast, random erasing, gaussian noise
torch_compile: false      # compile the U-Net and image encoders (slower start, maybe faster steps)

# ── Logging / saving ─────────────────────────────────────────────────────────
log_freq: 1
save_freq: 10000
push_to_hub: true         # uploads to <hub_user>/robot_learning_tutorial_<model_name>
hub_user: LuEduSoHu

# ── Weights & Biases ─────────────────────────────────────────────────────────
wandb: true               # one W&B run per training (needs `wandb login`; otherwise saved offline)
wandb_project: splatsim-diffusion
wandb_entity: null        # null -> the account's default entity
wandb_mode: online        # online / offline / disabled
wandb_log_freq: 10        # steps between logged points
