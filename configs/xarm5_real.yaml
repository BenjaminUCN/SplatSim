# Real xArm5 station (scripts/launch_nodes.py --robot xarm5, scripts/launch_camera_nodes.py).
#  ip: 192.168.123.52
ip: 172.16.33.89
# Joint pose (rad, 5 joints) that Reset Robot moves to, slowly. null = Reset Robot does nothing.
# Read from the real arm on 2026-10-28 (deg: 0, -27.5, -29.5, -34.7, 0.2). The sim resets to
# [0.0, -0.4886, -0.5235, -0.6108, 0.0] (joint_states of xarm5_lite_plant_v3 in objects.yaml).
home_joints: [0.0, -0.48, -0.5149, -0.6056, 0.0035]
reset_speed: 0.3          # rad/s of the slowest-finishing joint during Reset Robot
# Cameras: name the policy sees (same as in the sim) -> RealSense serial and ZMQ port of its
# camera node. serial: null = the detection order of launch_camera_nodes.py (not stable).
cameras:
  wrist_rgb: {serial: null, port: 5000}
  base_rgb: {serial: null, port: 5001}
recordings: ~/data/bc_data/real   # default folder for recordings (r/s + Enter, panel)
max_record_seconds: 120
# URDF shown in the control panel's 3D view (null = the one of --robot_name in objects.yaml)
urdf: null
# Gripper. type: xl330 = Dynamixel XL330 + OpenRB-150 by USB (hand_held_XL330); xarm = the xArm
# gripper, through the arm's controller.
gripper:
  type: xl330
  port: auto                # auto = finds the OpenRB-150 by its USB identity
  dxl_id: 1
  baudrate: 57600
  # Pulses, written by: python scripts/xarm5/xl330_gripper.py calibrate. null = it does not move.
  open_position: null
  closed_position: null
  current_limit_ma: 1200    # limit while moving or cutting (XL330 maximum 1750)
  profile_velocity: 40      # 0.229 rpm units: 40 = 9 rpm; 0 = maximum speed
  profile_acceleration: 30
  stall_seconds: 2.0        # pushing without advancing for this long: stops pushing
