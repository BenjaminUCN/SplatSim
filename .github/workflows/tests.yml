name: tests

# Corre tests/ en cada push y PR. Solo las dependencias que importan los tests (torch en CPU), sin
# submódulos ni GPU: lo que necesita el lab (rclone, la escena) se salta solo.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/tests.yml
      - name: Dependencias
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pyyaml scipy opencv-python-headless tyro plyfile
          pip install -e . --no-deps
      - name: Tests
        run: python -m unittest discover -s tests -v
