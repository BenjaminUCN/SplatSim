name: Docker images

on:
  workflow_dispatch:
  push:
    branches: [main, cloud-orchestrator]
    paths:
      - docker/**
      - .dockerignore
      - requirements-train.txt
      - scripts/runpod_setup.sh
      - scripts/xarm5/train_diffusion.py
      - splatsim/cloud/**
      - splatsim/utils/**
      - .github/workflows/images.yml

permissions:
  contents: read
  packages: write

jobs:
  train:
    runs-on: ubuntu-24.04
    env:
      IMAGE: ghcr.io/benjaminucn/splatsim-train
    steps:
      - name: Free disk space (torch with CUDA needs more than the runner leaves free)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v4

      - name: Build
        run: docker build -f docker/train.Dockerfile --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .

      - name: Smoke test
        run: |
          docker run --rm --entrypoint /opt/venv/bin/python "$IMAGE:latest" -c "import torch, torchcodec, lerobot, wandb, splatsim.cloud.runner; print(torch.__version__)"
          docker run --rm --entrypoint /opt/venv/bin/python "$IMAGE:latest" scripts/xarm5/train_diffusion.py --help > /dev/null
          docker run --rm --entrypoint /opt/venv/bin/python "$IMAGE:latest" splatsim/utils/lerobot_conversion.py --help > /dev/null
          docker run --rm --entrypoint rclone "$IMAGE:latest" version
          docker images "$IMAGE"

      - name: Push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
