name: Docker images

on:
  workflow_dispatch:
  push:
    branches: [main, cloud-orchestrator]
    paths:
      - docker/**
      - .dockerignore
      - requirements-train.txt
      - scripts/runpod_setup.sh
      - scripts/xarm5/train_diffusion.py
      - scripts/xarm5/render_recordings.py
      - scripts/xarm5/mirror_recordings.py
      - requirements-render.txt
      - splatsim/robots/**
      - submodules/**
      - splatsim/cloud/**
      - splatsim/utils/**
      - .github/workflows/images.yml

permissions:
  contents: read
  packages: write

jobs:
  train:
    runs-on: ubuntu-24.04
    env:
      IMAGE: ghcr.io/benjaminucn/splatsim-train
      RENDER_IMAGE: ghcr.io/benjaminucn/splatsim-render
    steps:
      - name: Free disk space (torch with CUDA needs more than the runner leaves free)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v4

      # Sin caché, cada build reinstala las dependencias y la capa de 4.5 GB sale con otro digest: un push
      # obligaría a todas las máquinas a bajarla de nuevo aunque ya tengan la imagen.
      - name: Build
        run: docker build -f docker/train.Dockerfile --cache-from "$IMAGE:latest" --build-arg BUILDKIT_INLINE_CACHE=1 --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .

      - name: Smoke test
        run: |
          docker run --rm --entrypoint /opt/venv/bin/python "$IMAGE:latest" -c "import torch, torchcodec, lerobot, wandb, splatsim.cloud.runner; print(torch.__version__)"
          docker run --rm --entrypoint /opt/venv/bin/python "$IMAGE:latest" scripts/xarm5/train_diffusion.py --help > /dev/null
          docker run --rm --entrypoint /opt/venv/bin/python "$IMAGE:latest" splatsim/utils/data/lerobot_conversion.py --help > /dev/null
          docker run --rm --entrypoint rclone "$IMAGE:latest" version
          docker images "$IMAGE"

      - name: Push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Fetch what the render image compiles
        run: |
          git submodule update --init --depth 1 submodules/simple-knn submodules/gaussian-splatting-wrapper/gaussian_splatting submodules/pybullet-URDF-models
          git -C submodules/gaussian-splatting-wrapper/gaussian_splatting submodule update --init --recursive --depth 1 submodules/diff-gaussian-rasterization

      - name: Build render image
        run: docker build -f docker/render.Dockerfile --build-arg BASE="$IMAGE:latest" --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" -t "$RENDER_IMAGE:${{ github.sha }}" -t "$RENDER_IMAGE:latest" .

      - name: Smoke test render image
        run: |
          docker run --rm --entrypoint /opt/venv/bin/python "$RENDER_IMAGE:latest" -c "import diff_gaussian_rasterization, simple_knn, pybullet, mujoco, e3nn, splatsim.cloud.runner, splatsim.robots.xarm.server; print('ok')"
          docker run --rm --entrypoint /opt/venv/bin/python "$RENDER_IMAGE:latest" scripts/xarm5/render_recordings.py --help > /dev/null
          docker run --rm --entrypoint /opt/venv/bin/python "$RENDER_IMAGE:latest" scripts/xarm5/mirror_recordings.py --help > /dev/null
          docker images "$RENDER_IMAGE"

      - name: Push render image
        run: |
          docker push "$RENDER_IMAGE:${{ github.sha }}"
          docker push "$RENDER_IMAGE:latest"
